      <text x="792" y="538" font-size="17.5" font-weight="bold" fill="#6D28D9">阶段性实验成果</text>
      <text x="792" y="562" font-size="13.5" fill="#6B7280">在同步、资源紧张的典型场景中，三组仿真测试的<tspan x="792" dy="20">完成时间改善约 8%—10%。</tspan></text>
    </g>
