      <text x="792" y="419" font-size="17.5" font-weight="bold" fill="#6D28D9">建立多场景评估流程</text>
      <text x="792" y="443" font-size="13.5" fill="#6B7280">完成软件和网络仿真对照，综合检查计算正确性、<tspan x="792" dy="20">资源占用和通信性能。</tspan></text>
    </g>
