    <text x="98" y="225" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="136" y="226" font-size="21" font-weight="bold" fill="#4C1D95">研究目标：提高分散资源的使用效率</text>
    <line x1="76" y1="254" x2="588" y2="254" stroke="#EFE8F8" stroke-width="1.5"/>
