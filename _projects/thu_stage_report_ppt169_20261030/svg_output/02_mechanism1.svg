      <use data-icon="tabler-outline/file-text" x="94" y="299" width="28" height="28" fill="#7C3AED"/>
      <line x1="156" y1="283" x2="156" y2="343" stroke="#E5DBF3" stroke-width="1.5"/>
      <text x="176" y="300" font-size="17.5" font-weight="bold" fill="#6D28D9">问题定位</text>
      <text x="176" y="324" font-size="13.5" fill="#6B7280">聚合资源分散于不同网络设备，局部资源紧张时，<tspan x="176" dy="20">其他设备的能力难以充分发挥。</tspan></text>
    </g>
    <line x1="76" y1="373" x2="588" y2="373" stroke="#F0EAF9" stroke-width="1"/>
    <g id="card-01-item-2">
      <circle cx="108" cy="432" r="28" fill="#F3EBFB"/>
