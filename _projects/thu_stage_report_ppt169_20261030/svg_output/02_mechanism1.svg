      <line x1="156" y1="402" x2="156" y2="462" stroke="#E5DBF3" stroke-width="1.5"/>
      <text x="176" y="419" font-size="17.5" font-weight="bold" fill="#6D28D9">目标能力</text>
      <text x="176" y="443" font-size="13.5" fill="#6B7280">在不改变计算节点布局的前提下，提高全网聚合<tspan x="176" dy="20">资源的可访问性与共享效率。</tspan></text>
    </g>
    <line x1="76" y1="491" x2="588" y2="491" stroke="#F0EAF9" stroke-width="1"/>
    <g id="card-01-item-3">
      <circle cx="108" cy="551" r="28" fill="#F3EBFB"/>
