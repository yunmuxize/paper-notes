    <text x="98" y="225" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="136" y="226" font-size="21" font-weight="bold" fill="#4C1D95">问题分析：资源竞争下的处理效率</text>
