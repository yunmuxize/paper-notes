      <use data-icon="tabler-outline/file-text" x="94" y="299" width="28" height="28" fill="#7C3AED"/>
      <line x1="156" y1="283" x2="156" y2="343" stroke="#E5DBF3" stroke-width="1.5"/>
      <text x="176" y="300" font-size="17.5" font-weight="bold" fill="#6D28D9">动态共享带来处理压力</text>
      <text x="176" y="324" font-size="13.5" fill="#6B7280">多任务并发时可能出现资源竞争，需要在保障结果<tspan x="176" dy="20">正确的同时控制额外通信。</tspan></text>
    </g>
    <line x1="76" y1="373" x2="588" y2="373" stroke="#F0EAF9" stroke-width="1"/>
    <g id="card-01-item-2">
      <circle cx="108" cy="432" r="28" fill="#F3EBFB"/>
      <use data-icon="tabler-outline/cube" x="94" y="418" width="28" height="28" fill="#7C3AED"/>
      <line x1="156" y1="402" x2="156" y2="462" stroke="#E5DBF3" stroke-width="1.5"/>
      <text x="176" y="419" font-size="17.5" font-weight="bold" fill="#6D28D9">异常处理影响通信效率</text>
      <text x="176" y="443" font-size="13.5" fill="#6B7280">资源冲突与重复传输可能增加等待时间，<tspan x="176" dy="20">影响分布式训练任务的执行效率。</tspan></text>
    </g>
    <line x1="76" y1="491" x2="588" y2="491" stroke="#F0EAF9" stroke-width="1"/>
    <g id="card-01-item-3">
      <circle cx="108" cy="551" r="28" fill="#F3EBFB"/>
