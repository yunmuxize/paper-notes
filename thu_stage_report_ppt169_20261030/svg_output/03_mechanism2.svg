      <line x1="156" y1="521" x2="156" y2="581" stroke="#E5DBF3" stroke-width="1.5"/>
      <text x="176" y="538" font-size="17.5" font-weight="bold" fill="#6D28D9">正确性是基本约束</text>
      <text x="176" y="562" font-size="13.5" fill="#6B7280">异常情况下仍需保证计算结果准确、处理责任清晰，<tspan x="176" dy="20">并及时完成资源回收。</tspan></text>
    </g>
